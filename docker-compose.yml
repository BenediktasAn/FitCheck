services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fitcheck
      POSTGRES_PASSWORD: fitcheck
      POSTGRES_DB: fitcheck
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
